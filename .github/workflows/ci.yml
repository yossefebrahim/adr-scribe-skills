name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Test
        run: make test

  no-optional-tools:
    # compatibility promises "no network access and no ripgrep required" --
    # prove it rather than asserting it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Remove rg and jq from PATH
        run: |
          sudo rm -f "$(command -v rg)" "$(command -v jq)" || true
      - run: make test

  no-git-mutations:
    # A grep is cheap insurance against a mutating git verb ever appearing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assert no mutating git verbs in shipped code
        run: |
          if grep -rnE '"(add|commit|push|fetch|pull|clone|checkout|reset)"' \
               skills/adr/scripts/adr_scribe/gitcmd.py; then
            echo "mutating git verb reached the allow-list"; exit 1
          fi
          if grep -rnE 'git (add|commit|push|fetch|pull) ' \
               skills/adr/scripts/ --include='*' ; then
            echo "a mutating git command appears in shipped code"; exit 1
          fi
          echo "clean"

  skill-validates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Frontmatter conforms to the Agent Skills spec
        run: make check-skill
